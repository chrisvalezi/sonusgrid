<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SonusGrid app icon - mesh of connected nodes whose horizontal link is an      audio wave. GNOME/Adwaita style: 128 px canvas, 8 px margin, flat colours,      a single 2-stop gradient for shading, no filters. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb8cb"/>
      <stop offset="1" stop-color="#178a9c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- slab: darker lip 2 px below the face -->
  <rect x="8" y="10" width="112" height="110" rx="20" fill="#0f6472"/>
  <!-- face -->
  <rect x="8" y="8" width="112" height="110" rx="20" fill="url(#face)"/>
  <!-- subtle top gloss -->
  <rect x="8" y="8" width="112" height="110" rx="20" fill="url(#gloss)"/>

  <!-- glyph shadow (same geometry, offset 2 px, dark teal) -->
  <g transform="translate(0 2)" fill="#0f6472" stroke="#0f6472" opacity="0.45">
    <path d="M64 24 V104" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M24 64 C31 64 32 46 39 46 C46 46 47 82 54 82 C59 82 60 64 64 64
             C68 64 69 46 74 46 C81 46 82 82 89 82 C96 82 97 64 104 64"
          stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="64" r="8" stroke="none"/>
    <circle cx="104" cy="64" r="8" stroke="none"/>
    <circle cx="64" cy="24" r="8" stroke="none"/>
    <circle cx="64" cy="104" r="8" stroke="none"/>
    <circle cx="64" cy="64" r="12" stroke="none"/>
  </g>

  <!-- vertical link: top node - hub - bottom node -->
  <path d="M64 24 V104" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- audio wave: left node - hub - right node -->
  <path d="M24 64 C31 64 32 46 39 46 C46 46 47 82 54 82 C59 82 60 64 64 64
           C68 64 69 46 74 46 C81 46 82 82 89 82 C96 82 97 64 104 64"
        stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- satellite nodes -->
  <circle cx="24"  cy="64"  r="8" fill="#ffffff"/>
  <circle cx="104" cy="64"  r="8" fill="#ffffff"/>
  <circle cx="64"  cy="24"  r="8" fill="#ffffff"/>
  <circle cx="64"  cy="104" r="8" fill="#ffffff"/>
  <!-- hub -->
  <circle cx="64" cy="64" r="12" fill="#ffffff"/>
  <circle cx="64" cy="64" r="4.5" fill="#178a9c"/>
</svg>
