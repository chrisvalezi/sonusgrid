             L13 8.75 C10.4 8.75 10.4 12.75 9.25 12.75 C7.6 12.75 7.4 6.25 5.75 6.25 C4.6 6.25 4.6 8.75 3 8.75 Z"/>
    <!-- nodes -->
    <circle cx="2"  cy="8"  r="1.6"/>
    <circle cx="14" cy="8"  r="1.6"/>
    <circle cx="8"  cy="2"  r="1.6"/>
    <circle cx="8"  cy="14" r="1.6"/>
