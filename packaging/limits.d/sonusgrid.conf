# SonusGrid: let the `audio` group run real-time audio threads.
# The sonusgrid-bridge TX/RX threads use SCHED_FIFO so CPU load on the box
# doesn't cause Dante dropouts; systemd --user can only grant what the login
# session's hard limits allow, and that is what these lines raise.
# Takes effect at the next login.
@audio   -   rtprio    95
@audio   -   memlock   unlimited
@audio   -   nice      -19
