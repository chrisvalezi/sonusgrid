[package]
name = "statime-macos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "PTPv1/v2 daemon for SonusGrid on macOS — wraps the platform-agnostic statime core"

[[bin]]
name = "statime-macos"
path = "src/main.rs"

[dependencies]
# Core PTP library is portable. The Linux daemon (statime-linux) lives next
# door but pulls in systemd-specific code we don't want here.
# statime = { path = "../../vendor/statime/statime" }
# statime-linux = ... (intentionally NOT pulled in)
# timestamped-socket = { path = "../../vendor/statime/timestamped-socket" }
# clock-steering = { path = "../../vendor/statime/clock-steering" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
# coreaudio-sys = "0.2"   # added when we wire the ServerPlugIn-side clock fan-out
# system-configuration = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
