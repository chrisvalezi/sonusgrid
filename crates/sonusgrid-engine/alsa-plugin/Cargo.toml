[package]
name = "sonusgrid_alsa_plugin"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later OR AGPL-3.0-or-later"

[lib]
# Output filename: libasound_module_pcm_sonusgrid.so
# ALSA loads libasound_module_pcm_<NAME>.so when an asoundrc declares
# `type <NAME>`. We use `type sonusgrid` in the rendered asoundrc.
name = "asound_module_pcm_sonusgrid"
crate-type = ["cdylib"]

[dependencies]
alsa-sys-all = { path = "../alsa-sys-all" }
libc = "0.2.153"
sonusgrid_engine = { path = "../aoip" }
env_logger = "0.11.2"
log = "0.4.20"
tokio = { version = "1.36.0", features = ["sync"] }
futures-util = "0.3.30"
lazy_static = "1.5.0"
itertools = "0.14.0"
