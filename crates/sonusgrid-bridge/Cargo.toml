[package]
name = "sonusgrid-bridge"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Rust full-duplex bridge between PipeWire/Pulse and the SonusGrid ALSA plug-in. Replaces the multi-input ffmpeg pipeline that introduced 20+ s of latency."

[[bin]]
name = "sonusgrid-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
alsa = "0.9"
libpulse-binding = "2"
libpulse-simple-binding = "2"
jack = "0.13"
crossbeam-queue = "0.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
